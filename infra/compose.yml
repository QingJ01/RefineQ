name: refineq

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      REFINEQ_DATA_ROOT: /data
      REFINEQ_HOST: 0.0.0.0
      REFINEQ_PORT: 8000
    volumes:
      - refineq-data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        REFINEQ_API_ORIGIN: http://api:8000
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      REFINEQ_DOMAIN: "${REFINEQ_DOMAIN:-:80}"
    ports:
      - "${REFINEQ_HTTP_PORT:-80}:80"
      - "${REFINEQ_HTTPS_PORT:-443}:443"
      - "${REFINEQ_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  refineq-data:
  caddy-data:
  caddy-config:
