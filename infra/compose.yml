name: refineq

services:
  database:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      - "POSTGRES_DB=${REFINEQ_POSTGRES_DB:-refineq}"
      - "POSTGRES_USER=${REFINEQ_POSTGRES_USER:-refineq}"
      - "POSTGRES_PASSWORD=${REFINEQ_POSTGRES_PASSWORD:-refineq-local-change-me}"
    volumes:
      - refineq-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${REFINEQ_POSTGRES_USER:-refineq} -d ${REFINEQ_POSTGRES_DB:-refineq}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      REFINEQ_DATA_ROOT: /data
      REFINEQ_DATABASE_URL: "${REFINEQ_DATABASE_URL:-postgresql+psycopg://refineq:refineq-local-change-me@database:5432/refineq}"
      REFINEQ_HOST: 0.0.0.0
      REFINEQ_PORT: 8000
      REFINEQ_FORWARDED_ALLOW_IPS: "${REFINEQ_FORWARDED_ALLOW_IPS:-*}"
      REFINEQ_MODEL_ENCRYPTION_KEY: "${REFINEQ_MODEL_ENCRYPTION_KEY:-}"
      REFINEQ_MODEL_ENDPOINT_ALLOWED_HOSTS: "${REFINEQ_MODEL_ENDPOINT_ALLOWED_HOSTS:-api.openai.com,api.deepseek.com}"
      REFINEQ_MATERIAL_MAX_COUNT_PER_USER: "${REFINEQ_MATERIAL_MAX_COUNT_PER_USER:-500}"
      REFINEQ_MATERIAL_MAX_BYTES_PER_USER: "${REFINEQ_MATERIAL_MAX_BYTES_PER_USER:-2147483648}"
      REFINEQ_MATERIAL_MAX_REQUEST_BYTES: "${REFINEQ_MATERIAL_MAX_REQUEST_BYTES:-54525952}"
      REFINEQ_MATERIAL_UPLOAD_MAX_CONCURRENT_GLOBAL: "${REFINEQ_MATERIAL_UPLOAD_MAX_CONCURRENT_GLOBAL:-2}"
      REFINEQ_MATERIAL_UPLOAD_MAX_CONCURRENT_PER_USER: "${REFINEQ_MATERIAL_UPLOAD_MAX_CONCURRENT_PER_USER:-1}"
      REFINEQ_MATERIAL_UPLOAD_BODY_IDLE_TIMEOUT_SECONDS: "${REFINEQ_MATERIAL_UPLOAD_BODY_IDLE_TIMEOUT_SECONDS:-10}"
      REFINEQ_MATERIAL_UPLOAD_BODY_TOTAL_TIMEOUT_SECONDS: "${REFINEQ_MATERIAL_UPLOAD_BODY_TOTAL_TIMEOUT_SECONDS:-60}"
      REFINEQ_MATERIAL_MAX_PDF_PAGES: "${REFINEQ_MATERIAL_MAX_PDF_PAGES:-500}"
      REFINEQ_MATERIAL_MAX_DOCX_ENTRIES: "${REFINEQ_MATERIAL_MAX_DOCX_ENTRIES:-2000}"
      REFINEQ_MATERIAL_MAX_DOCX_EXPANDED_BYTES: "${REFINEQ_MATERIAL_MAX_DOCX_EXPANDED_BYTES:-104857600}"
      REFINEQ_MATERIAL_MAX_DOCX_COMPRESSION_RATIO: "${REFINEQ_MATERIAL_MAX_DOCX_COMPRESSION_RATIO:-100}"
      REFINEQ_MATERIAL_MAX_EXTRACTED_CHARS: "${REFINEQ_MATERIAL_MAX_EXTRACTED_CHARS:-2000000}"
      REFINEQ_MATERIAL_EXTRACTION_TIMEOUT_SECONDS: "${REFINEQ_MATERIAL_EXTRACTION_TIMEOUT_SECONDS:-15}"
      REFINEQ_MAX_WORKSPACES_PER_USER: "${REFINEQ_MAX_WORKSPACES_PER_USER:-100}"
      REFINEQ_MAX_PROJECTS_PER_USER: "${REFINEQ_MAX_PROJECTS_PER_USER:-100}"
      REFINEQ_MAX_AGENT_SESSIONS_PER_USER: "${REFINEQ_MAX_AGENT_SESSIONS_PER_USER:-200}"
      REFINEQ_AUTH_RATE_LIMIT_REQUESTS: "${REFINEQ_AUTH_RATE_LIMIT_REQUESTS:-30}"
      REFINEQ_MUTATION_RATE_LIMIT_REQUESTS: "${REFINEQ_MUTATION_RATE_LIMIT_REQUESTS:-240}"
      REFINEQ_RATE_LIMIT_WINDOW_SECONDS: "${REFINEQ_RATE_LIMIT_WINDOW_SECONDS:-60}"
    volumes:
      - refineq-data:/data
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        REFINEQ_API_ORIGIN: http://api:8000
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      REFINEQ_DOMAIN: "${REFINEQ_DOMAIN:-:80}"
      REFINEQ_MATERIAL_MAX_REQUEST_BYTES: "${REFINEQ_MATERIAL_MAX_REQUEST_BYTES:-54525952}"
    ports:
      - "${REFINEQ_HTTP_PORT:-80}:80"
      - "${REFINEQ_HTTPS_PORT:-443}:443"
      - "${REFINEQ_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  refineq-data:
  refineq-postgres:
  caddy-data:
  caddy-config:
